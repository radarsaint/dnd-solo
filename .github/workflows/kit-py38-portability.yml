# Check the minimum supported host Python with the same PDF reader used by a host.
# Engineering tests only; no model API, private books, or agent playthroughs.
name: kit-python38

on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'tests/**'
      - '.github/workflows/kit-py38-portability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python38:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Project context checks resolve a recorded historical semantic commit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - name: Install the actual PDF text reader used by the host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftotext -v
      - name: Confirm Python 3.8 and import the complete runtime
        run: |
          python -c 'import sys; assert sys.version_info[:2] == (3, 8), sys.version'
          python -m runtime.kit_agent --help > /dev/null
          python -m unittest discover -s tests -p 'test_kit_py38_runtime_gpt.py' -v
      - name: Verify the complete offline Kit mount on Python 3.8
        run: |
          python scripts/kit_host.py build --repo . --output "$RUNNER_TEMP/kit-py38.zip"
          python scripts/kit_host.py mount --archive "$RUNNER_TEMP/kit-py38.zip" --destination "$RUNNER_TEMP/kit-py38-mounted" --expected-commit "$(git rev-parse HEAD)"
          python scripts/kit_host.py verify --root "$RUNNER_TEMP/kit-py38-mounted/kit-$(git rev-parse HEAD)" --expected-commit "$(git rev-parse HEAD)"
      - name: Run the source-contract, secrecy and host-path regressions
        run: |
          python -m unittest discover -s tests -p 'test_kit_scene_contract_gpt.py' -v
          python -m unittest discover -s tests -p 'test_kit_source_scope_gpt.py' -v
          python -m unittest discover -s tests -p 'test_kit_unattested_actors_gpt.py' -v
          python -m unittest discover -s tests -p 'test_kit_source_ambush_gpt.py' -v
          python -m unittest discover -s tests -p 'test_kit_pdf_retention_gpt.py' -v
          python -m unittest discover -s tests -p 'test_kit_host_contract_round2.py' -v
          python -m unittest discover -s tests -p 'test_kit_indexed_opening_gpt.py' -v
          python -m unittest discover -s tests -p 'test_kit_player_save.py' -v
      - name: Run complete repository tests on real Python 3.8
        run: python -m unittest discover -s tests -q
